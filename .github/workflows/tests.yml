name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sisweb_testing
          MARIADB_USER: sisweb_testing
          MARIADB_PASSWORD: sisweb-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      APP_ENV: testing
      DB_DATABASE: sisweb_testing
      DB_USERNAME: sisweb_testing
      DB_PASSWORD: sisweb-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.testing.example .env.testing

      - name: Restrict Testing Account to Exact Database
        env:
          MYSQL_PWD: root
        run: |
          docker exec --interactive --env MYSQL_PWD "${{ job.services.mariadb.id }}" mariadb --user=root <<'SQL'
          REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'sisweb_testing'@'%';
          GRANT ALL PRIVILEGES ON `sisweb\_testing`.* TO 'sisweb_testing'@'%';
          SQL

      - name: Verify Testing Isolation
        run: php tests/preflight.php

      - name: Tests
        run: ./vendor/bin/pest --fail-on-risky
