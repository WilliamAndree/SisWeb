<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .t{font-size:17px;font-weight:800;fill:#0f172a}
      .s{font-size:13.5px;fill:#334155}
      .l{font-size:13px;fill:#475569}
      .h{font-size:15px;font-weight:800;fill:#0f172a}
      .n{font-size:15px;font-weight:800;fill:#0f172a}
      .per{fill:#dcfce7;stroke:#16a34a}
      .ia{fill:#dbeafe;stroke:#2563eb}
      .del{fill:#fef3c7;stroke:#d97706}
      .aut{fill:#f1f5f9;stroke:#64748b}
      .caja{stroke-width:2;rx:10}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .dash{stroke:#334155;stroke-width:1.6;fill:none;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="800" fill="#17133a">CheckITSE Huancayo · Metodología de desarrollo con IA</text>
  <text x="40" y="70" class="s">Flujo real del proyecto: cada cambio pasa por rama, pruebas, pipeline y calidad antes de desplegarse. La aprobación siempre es humana.</text>

  <!-- Leyenda -->
  <rect x="40" y="88" width="120" height="30" class="per caja"/><text x="100" y="108" text-anchor="middle" class="l">Solo persona</text>
  <rect x="172" y="88" width="190" height="30" class="ia caja"/><text x="267" y="108" text-anchor="middle" class="l">Persona asistida por IA</text>
  <rect x="374" y="88" width="210" height="30" class="del caja"/><text x="479" y="108" text-anchor="middle" class="l">IA con ejecución delegada</text>
  <rect x="596" y="88" width="190" height="30" class="aut caja"/><text x="691" y="108" text-anchor="middle" class="l">Automatizado, sin IA</text>
  <line x1="810" y1="103" x2="860" y2="103" class="ln" marker-end="url(#f)"/><text x="870" y="108" class="l">Avance</text>
  <line x1="940" y1="103" x2="990" y2="103" class="dash" marker-end="url(#f)"/><text x="1000" y="108" class="l">Corrección o retroalimentación</text>

  <rect x="30" y="135" width="1540" height="830" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="14"/>
  <text x="300" y="165" text-anchor="middle" class="h">FASE DE INICIO</text>
  <text x="1050" y="165" text-anchor="middle" class="h">FASE DE CONSTRUCCIÓN Y CALIDAD</text>
  <line x1="60" y1="175" x2="540" y2="175" stroke="#94a3b8"/><line x1="600" y1="175" x2="1540" y2="175" stroke="#94a3b8"/>

  <!-- Etapas 1-6 -->
  <g>
    <text x="140" y="205" text-anchor="middle" class="n">1</text>
    <rect x="55" y="215" width="170" height="120" class="per caja"/>
    <text x="140" y="250" text-anchor="middle" class="t">Necesidad</text>
    <text x="140" y="275" text-anchor="middle" class="s">Proceso ITSE del</text>
    <text x="140" y="293" text-anchor="middle" class="s">emprendedor (D.S.</text>
    <text x="140" y="311" text-anchor="middle" class="s">002-2018-PCM)</text>

    <text x="390" y="205" text-anchor="middle" class="n">2</text>
    <rect x="265" y="215" width="250" height="120" class="ia caja"/>
    <text x="390" y="250" text-anchor="middle" class="t">Requisito y criterio</text>
    <text x="390" y="275" text-anchor="middle" class="s">Condición normativa (CRIT-xx)</text>
    <text x="390" y="293" text-anchor="middle" class="s">y proceso de la matriz</text>
    <text x="390" y="311" text-anchor="middle" class="s">(E1–E2, M1–M6, S1–S5)</text>

    <text x="680" y="205" text-anchor="middle" class="n">3</text>
    <rect x="560" y="215" width="240" height="120" class="del caja"/>
    <text x="680" y="250" text-anchor="middle" class="t">Diseño y plan</text>
    <text x="680" y="275" text-anchor="middle" class="s">La IA propone diseño,</text>
    <text x="680" y="293" text-anchor="middle" class="s">alcance y pruebas</text>

    <text x="930" y="205" text-anchor="middle" class="n">4</text>
    <rect x="835" y="215" width="190" height="120" class="per caja"/>
    <text x="930" y="250" text-anchor="middle" class="t">Aprobación</text>
    <text x="930" y="275" text-anchor="middle" class="s">El equipo revisa;</text>
    <text x="930" y="293" text-anchor="middle" class="s">sin aprobación no se</text>
    <text x="930" y="311" text-anchor="middle" class="s">edita código</text>

    <text x="1160" y="205" text-anchor="middle" class="n">5</text>
    <rect x="1060" y="215" width="200" height="120" class="del caja"/>
    <text x="1160" y="250" text-anchor="middle" class="t">Construcción</text>
    <text x="1160" y="275" text-anchor="middle" class="s">Rama feature/… con</text>
    <text x="1160" y="293" text-anchor="middle" class="s">código y pruebas</text>

    <text x="1410" y="205" text-anchor="middle" class="n">6</text>
    <rect x="1295" y="215" width="235" height="120" class="aut caja"/>
    <text x="1412" y="250" text-anchor="middle" class="t">Integración y calidad</text>
    <text x="1412" y="275" text-anchor="middle" class="s">GitHub Actions +</text>
    <text x="1412" y="293" text-anchor="middle" class="s">SonarQube (Quality Gate)</text>
  </g>
  <line x1="225" y1="275" x2="263" y2="275" class="ln" marker-end="url(#f)"/>
  <line x1="515" y1="275" x2="558" y2="275" class="ln" marker-end="url(#f)"/>
  <line x1="800" y1="275" x2="833" y2="275" class="ln" marker-end="url(#f)"/>
  <line x1="1025" y1="275" x2="1058" y2="275" class="ln" marker-end="url(#f)"/>
  <line x1="1260" y1="275" x2="1293" y2="275" class="ln" marker-end="url(#f)"/>
  <path d="M930 335 V365 H680 V337" class="dash" marker-end="url(#f)"/><text x="805" y="385" text-anchor="middle" class="l">Ajustes al plan</text>
  <line x1="1160" y1="335" x2="1160" y2="430" class="ln" marker-end="url(#f)"/><text x="1170" y="395" class="l">se descompone</text>
  <line x1="1412" y1="335" x2="1412" y2="660" class="ln" marker-end="url(#f)"/>

  <!-- Construcción con pruebas -->
  <rect x="60" y="430" width="1450" height="190" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="12"/>
  <text x="785" y="458" text-anchor="middle" class="h">Construcción de cada cambio con pruebas</text>
  <rect x="90" y="475" width="250" height="90" class="ia caja"/><text x="215" y="510" text-anchor="middle" class="t">Rama desde develop</text><text x="215" y="535" text-anchor="middle" class="s">feature/… · fix/…</text>
  <rect x="375" y="475" width="250" height="90" class="del caja"/><text x="500" y="510" text-anchor="middle" class="t">Prueba primero</text><text x="500" y="535" text-anchor="middle" class="s">Pest (775) · Cypress (10)</text>
  <rect x="660" y="475" width="250" height="90" class="del caja"/><text x="785" y="510" text-anchor="middle" class="t">Implementación</text><text x="785" y="535" text-anchor="middle" class="s">Laravel 12 · React 19</text>
  <rect x="945" y="475" width="250" height="90" class="aut caja"/><text x="1070" y="510" text-anchor="middle" class="t">Pruebas en verde</text><text x="1070" y="535" text-anchor="middle" class="s">Pint · ESLint · tsc · Pest</text>
  <rect x="1230" y="475" width="250" height="90" class="ia caja"/><text x="1355" y="510" text-anchor="middle" class="t">Commit atómico</text><text x="1355" y="535" text-anchor="middle" class="s">tipo(alcance): mensaje</text>
  <line x1="340" y1="520" x2="373" y2="520" class="ln" marker-end="url(#f)"/>
  <line x1="625" y1="520" x2="658" y2="520" class="ln" marker-end="url(#f)"/>
  <line x1="910" y1="520" x2="943" y2="520" class="ln" marker-end="url(#f)"/>
  <line x1="1195" y1="520" x2="1228" y2="520" class="ln" marker-end="url(#f)"/>
  <path d="M1355 565 V598 H500 V567" class="dash" marker-end="url(#f)"/><text x="928" y="612" text-anchor="middle" class="l">Se repite hasta cubrir el requisito</text>

  <!-- Validación, despliegue y verificación -->
  <rect x="60" y="660" width="1450" height="200" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="12"/>
  <text x="785" y="688" text-anchor="middle" class="h">Validación, despliegue y verificación</text>
  <rect x="90" y="705" width="260" height="110" class="ia caja"/><text x="220" y="740" text-anchor="middle" class="t">Push a main y develop</text><text x="220" y="765" text-anchor="middle" class="s">GitHub (WilliamAndree/SisWeb)</text>
  <rect x="385" y="705" width="270" height="110" class="aut caja"/><text x="520" y="740" text-anchor="middle" class="t">CI en GitHub Actions</text><text x="520" y="765" text-anchor="middle" class="s">linter · Pest + cobertura</text><text x="520" y="785" text-anchor="middle" class="s">· Cypress (E2E)</text>
  <rect x="690" y="705" width="250" height="110" class="aut caja"/><text x="815" y="740" text-anchor="middle" class="t">SonarQube</text><text x="815" y="765" text-anchor="middle" class="s">Quality Gate aprobado</text><text x="815" y="785" text-anchor="middle" class="s">cobertura 90 %</text>
  <rect x="975" y="705" width="250" height="110" class="aut caja"/><text x="1100" y="740" text-anchor="middle" class="t">Despliegue (CD)</text><text x="1100" y="765" text-anchor="middle" class="s">XAMPP con puerta de CI</text><text x="1100" y="785" text-anchor="middle" class="s">· Render automático</text>
  <rect x="1260" y="705" width="220" height="110" class="per caja"/><text x="1370" y="740" text-anchor="middle" class="t">Verificación</text><text x="1370" y="765" text-anchor="middle" class="s">/up 200 + prueba E2E-00</text><text x="1370" y="785" text-anchor="middle" class="s">revisión del equipo</text>
  <line x1="350" y1="760" x2="383" y2="760" class="ln" marker-end="url(#f)"/>
  <line x1="655" y1="760" x2="688" y2="760" class="ln" marker-end="url(#f)"/>
  <line x1="940" y1="760" x2="973" y2="760" class="ln" marker-end="url(#f)"/>
  <line x1="1225" y1="760" x2="1258" y2="760" class="ln" marker-end="url(#f)"/>
  <path d="M520 815 V890 H80 V560 H88" class="dash" marker-end="url(#f)"/><text x="300" y="910" text-anchor="middle" class="l">Si una prueba, el linter o SonarQube fallan: nuevo cambio (no se despliega)</text>
  <text x="800" y="945" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">«IA con ejecución delegada»: la IA (Claude Code) ejecuta el paso; la decisión y la aprobación son responsabilidad del equipo.</text>
</svg>
