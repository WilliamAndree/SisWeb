<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1820 1130" width="1820" height="1130" font-family="Segoe UI, Segoe UI Emoji, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="fr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <!-- Mascota robot de Claude Code (ilustración propia) -->
    <symbol id="robot" viewBox="0 0 64 64">
      <line x1="32" y1="5" x2="32" y2="13" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="5" r="4.5" fill="#fbbf24" stroke="#7c2d12" stroke-width="1.5"/>
      <rect x="4" y="24" width="7" height="12" rx="3" fill="#b45309"/>
      <rect x="53" y="24" width="7" height="12" rx="3" fill="#b45309"/>
      <rect x="9" y="12" width="46" height="36" rx="13" fill="#d97757" stroke="#7c2d12" stroke-width="2"/>
      <rect x="15" y="19" width="34" height="18" rx="9" fill="#fff7ed"/>
      <circle cx="24.5" cy="28" r="4.3" fill="#1f2937"/><circle cx="39.5" cy="28" r="4.3" fill="#1f2937"/>
      <circle cx="26" cy="26.4" r="1.5" fill="#fff"/><circle cx="41" cy="26.4" r="1.5" fill="#fff"/>
      <circle cx="17.5" cy="41" r="2.4" fill="#fca5a5"/><circle cx="46.5" cy="41" r="2.4" fill="#fca5a5"/>
      <path d="M26.5 40.5 Q32 45.5 37.5 40.5" stroke="#7c2d12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <rect x="20" y="49" width="24" height="12" rx="5" fill="#d97757" stroke="#7c2d12" stroke-width="2"/>
      <circle cx="32" cy="55" r="2.6" fill="#fde68a"/>
    </symbol>
    <style>
      .t{font-size:15.5px;font-weight:800;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .n{font-size:15px;font-weight:800;fill:#0f172a}
      .h{font-size:14px;font-weight:800;fill:#0f172a;letter-spacing:.3px}
      .lg{font-size:13px;fill:#334155}
      .per{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .asi{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .del{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .aut{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .rt{stroke:#b91c1c;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
      .dash{stroke:#334155;stroke-width:1.6;fill:none;stroke-dasharray:7 5}
      .rl{font-size:12.5px;fill:#475569}
      .p{font-size:13.5px;fill:#1f2937}
      .pt{font-size:15px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect width="1820" height="1130" fill="#ffffff"/>

  <!-- Título -->
  <use xlink:href="#robot" href="#robot" x="30" y="14" width="56" height="56"/>
  <text x="96" y="46" font-size="27" font-weight="800" fill="#17133a">CheckITSE Huancayo · Metodología de desarrollo con IA</text>
  <text x="96" y="70" font-size="14.5" fill="#334155">Claude Code (asistente de IA en VS Code) ejecuta los pasos técnicos; el equipo define, aprueba y revisa; la automatización valida antes de publicar.</text>

  <!-- Leyenda -->
  <rect x="96" y="88" width="120" height="30" rx="8" class="per"/><text x="156" y="108" text-anchor="middle" class="lg">Solo persona</text>
  <rect x="228" y="88" width="190" height="30" rx="8" class="asi"/><text x="323" y="108" text-anchor="middle" class="lg">Persona asistida por IA</text>
  <rect x="430" y="88" width="240" height="30" rx="8" class="del"/><use href="#robot" x="438" y="91" width="24" height="24"/><text x="562" y="108" text-anchor="middle" class="lg">IA con ejecución delegada</text>
  <rect x="682" y="88" width="190" height="30" rx="8" class="aut"/><text x="777" y="108" text-anchor="middle" class="lg">Automatizado, sin IA</text>
  <line x1="892" y1="103" x2="940" y2="103" class="ln" marker-end="url(#f)"/><text x="948" y="108" class="lg">Avance</text>
  <line x1="1010" y1="103" x2="1058" y2="103" class="dash" marker-end="url(#f)"/><text x="1066" y="108" class="lg">Ciclo o corrección</text>

  <!-- Marco principal -->
  <rect x="30" y="132" width="1300" height="980" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="258" y="160" text-anchor="middle" class="h">FASE DE INICIO</text>
  <text x="896" y="160" text-anchor="middle" class="h">FASE DE CONSTRUCCIÓN Y CALIDAD</text>
  <line x1="50" y1="170" x2="466" y2="170" stroke="#94a3b8"/><line x1="480" y1="170" x2="1310" y2="170" stroke="#94a3b8"/>

  <!-- Fila superior: 6 etapas -->
  <g>
    <text x="147" y="194" text-anchor="middle" class="n">1</text>
    <rect x="50" y="202" width="195" height="138" rx="10" class="per"/>
    <text x="147" y="230" text-anchor="middle" class="t">Necesidad</text>
    <text x="147" y="254" text-anchor="middle" class="s">El equipo describe el problema</text>
    <text x="147" y="272" text-anchor="middle" class="s">del emprendedor frente al</text>
    <text x="147" y="290" text-anchor="middle" class="s">ITSE (D.S. 002-2018-PCM)</text>
    <text x="147" y="320" text-anchor="middle" font-size="12" font-style="italic" fill="#166534">«mi local no se guarda»</text>

    <text x="360" y="194" text-anchor="middle" class="n">2</text>
    <rect x="263" y="202" width="195" height="138" rx="10" class="asi"/>
    <text x="360" y="230" text-anchor="middle" class="t">Requisito</text>
    <text x="360" y="254" text-anchor="middle" class="s">Claude ayuda a redactarlo:</text>
    <text x="360" y="272" text-anchor="middle" class="s">condición normativa (CRIT-xx)</text>
    <text x="360" y="290" text-anchor="middle" class="s">y proceso de la matriz</text>
    <text x="360" y="308" text-anchor="middle" class="s">(M1–M6, S1–S5)</text>

    <text x="573" y="194" text-anchor="middle" class="n">3</text>
    <rect x="476" y="202" width="195" height="138" rx="10" class="del"/>
    <use href="#robot" x="641" y="184" width="30" height="30"/>
    <text x="573" y="230" text-anchor="middle" class="t">Diagnóstico y plan</text>
    <text x="573" y="254" text-anchor="middle" class="s">Claude lee el código, los</text>
    <text x="573" y="272" text-anchor="middle" class="s">registros y la base de datos;</text>
    <text x="573" y="290" text-anchor="middle" class="s">explica la causa y propone</text>
    <text x="573" y="308" text-anchor="middle" class="s">el cambio y sus pruebas</text>

    <text x="786" y="194" text-anchor="middle" class="n">4</text>
    <rect x="689" y="202" width="195" height="138" rx="10" class="per"/>
    <text x="786" y="230" text-anchor="middle" class="t">Aprobación</text>
    <text x="786" y="254" text-anchor="middle" class="s">El equipo aprueba o pide</text>
    <text x="786" y="272" text-anchor="middle" class="s">otra solución. Sin</text>
    <text x="786" y="290" text-anchor="middle" class="s">aprobación no se edita</text>
    <text x="786" y="308" text-anchor="middle" class="s">el código</text>

    <text x="999" y="194" text-anchor="middle" class="n">5</text>
    <rect x="902" y="202" width="195" height="138" rx="10" class="del"/>
    <use href="#robot" x="1067" y="184" width="30" height="30"/>
    <text x="999" y="230" text-anchor="middle" class="t">Construcción</text>
    <text x="999" y="254" text-anchor="middle" class="s">Claude programa en una</text>
    <text x="999" y="272" text-anchor="middle" class="s">rama: Laravel, React y</text>
    <text x="999" y="290" text-anchor="middle" class="s">las pruebas del cambio</text>
    <text x="999" y="308" text-anchor="middle" class="s">(una prueba por requisito)</text>

    <text x="1212" y="194" text-anchor="middle" class="n">6</text>
    <rect x="1115" y="202" width="195" height="138" rx="10" class="aut"/>
    <text x="1212" y="230" text-anchor="middle" class="t">Validación e</text>
    <text x="1212" y="248" text-anchor="middle" class="t">integración</text>
    <text x="1212" y="272" text-anchor="middle" class="s">GitHub Actions, SonarQube</text>
    <text x="1212" y="290" text-anchor="middle" class="s">y revisión del equipo antes</text>
    <text x="1212" y="308" text-anchor="middle" class="s">de publicar</text>
  </g>
  <line x1="245" y1="271" x2="261" y2="271" class="ln" marker-end="url(#f)"/>
  <line x1="458" y1="271" x2="474" y2="271" class="ln" marker-end="url(#f)"/>
  <line x1="671" y1="271" x2="687" y2="271" class="ln" marker-end="url(#f)"/>
  <line x1="884" y1="271" x2="900" y2="271" class="ln" marker-end="url(#f)"/>
  <line x1="1097" y1="271" x2="1113" y2="271" class="ln" marker-end="url(#f)"/>
  <path d="M786 340 V362 H573 V342" class="dash" marker-end="url(#f)"/><text x="680" y="378" text-anchor="middle" class="rl">Ajustes al plan</text>
  <line x1="999" y1="340" x2="999" y2="396" class="ln" marker-end="url(#f)"/><text x="1009" y="374" class="rl">se descompone</text>
  <line x1="1212" y1="340" x2="1212" y2="666" class="ln" marker-end="url(#f)"/><text x="1222" y="374" class="rl">integra</text>

  <!-- Construcción con TDD -->
  <rect x="60" y="398" width="1240" height="214" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <use href="#robot" x="440" y="403" width="30" height="30"/>
  <text x="680" y="426" text-anchor="middle" class="h">Construcción de cada cambio con Claude Code (TDD)</text>
  <g>
    <rect x="80" y="446" width="220" height="108" rx="10" class="asi"/>
    <text x="190" y="474" text-anchor="middle" class="t">Rama desde develop</text>
    <text x="190" y="497" text-anchor="middle" class="s">feature/… o fix/…</text>
    <text x="190" y="515" text-anchor="middle" class="s">el equipo indica el alcance</text>

    <rect x="326" y="446" width="220" height="108" rx="10" class="del"/><use href="#robot" x="517" y="430" width="26" height="26"/>
    <text x="436" y="474" text-anchor="middle" class="t">Prueba primero</text>
    <text x="436" y="497" text-anchor="middle" class="s">Claude escribe la prueba</text>
    <text x="436" y="515" text-anchor="middle" class="s">que debe cumplirse (Pest)</text>

    <rect x="572" y="446" width="220" height="108" rx="10" class="del"/><use href="#robot" x="763" y="430" width="26" height="26"/>
    <text x="682" y="474" text-anchor="middle" class="t">Implementación</text>
    <text x="682" y="497" text-anchor="middle" class="s">Lo mínimo para pasar:</text>
    <text x="682" y="515" text-anchor="middle" class="s">PHP 8.2 · Laravel 12 · React 19</text>

    <rect x="818" y="446" width="220" height="108" rx="10" class="del"/><use href="#robot" x="1009" y="430" width="26" height="26"/>
    <text x="928" y="474" text-anchor="middle" class="t">Prueba como cliente</text>
    <text x="928" y="497" text-anchor="middle" class="s">Navegador automatizado:</text>
    <text x="928" y="515" text-anchor="middle" class="s">registra, guarda y captura</text>

    <rect x="1064" y="446" width="220" height="108" rx="10" class="del"/><use href="#robot" x="1255" y="430" width="26" height="26"/>
    <text x="1174" y="474" text-anchor="middle" class="t">Commit atómico</text>
    <text x="1174" y="497" text-anchor="middle" class="s">tipo(alcance): mensaje</text>
    <text x="1174" y="515" text-anchor="middle" class="s">nunca sube claves ni .env</text>
  </g>
  <line x1="300" y1="500" x2="324" y2="500" class="ln" marker-end="url(#f)"/>
  <line x1="546" y1="500" x2="570" y2="500" class="ln" marker-end="url(#f)"/>
  <line x1="792" y1="500" x2="816" y2="500" class="ln" marker-end="url(#f)"/>
  <line x1="1038" y1="500" x2="1062" y2="500" class="ln" marker-end="url(#f)"/>
  <path d="M1174 554 V584 H436 V556" class="dash" marker-end="url(#f)"/><text x="805" y="600" text-anchor="middle" class="rl">Se repite hasta cubrir el requisito (Pest, tsc y ESLint en verde)</text>
  <line x1="680" y1="612" x2="680" y2="664" class="ln" marker-end="url(#f)"/><text x="690" y="644" class="rl">push a GitHub (rama → main y develop)</text>

  <!-- Validación, despliegue y verificación -->
  <rect x="60" y="666" width="1240" height="226" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="680" y="694" text-anchor="middle" class="h">Validación, despliegue y verificación</text>
  <g>
    <rect x="80" y="714" width="220" height="118" rx="10" class="aut"/>
    <text x="190" y="742" text-anchor="middle" class="t">CI en GitHub Actions</text>
    <text x="190" y="765" text-anchor="middle" class="s">Linter (Pint, ESLint, tsc)</text>
    <text x="190" y="783" text-anchor="middle" class="s">775 pruebas PHP + cobertura</text>
    <text x="190" y="801" text-anchor="middle" class="s">Cypress E2E (8 escenarios)</text>

    <rect x="326" y="714" width="220" height="118" rx="10" class="aut"/>
    <text x="436" y="742" text-anchor="middle" class="t">SonarQube</text>
    <text x="436" y="765" text-anchor="middle" class="s">Quality Gate aprobado</text>
    <text x="436" y="783" text-anchor="middle" class="s">0 bugs · 0 vulnerabilidades</text>
    <text x="436" y="801" text-anchor="middle" class="s">cobertura 90 %</text>

    <rect x="572" y="714" width="220" height="118" rx="10" class="aut"/>
    <text x="682" y="742" text-anchor="middle" class="t">Despliegue (CD)</text>
    <text x="682" y="765" text-anchor="middle" class="s">Render: automático en ~2 min</text>
    <text x="682" y="783" text-anchor="middle" class="s">XAMPP: solo si el CI</text>
    <text x="682" y="801" text-anchor="middle" class="s">está en verde (puerta de CI)</text>

    <rect x="818" y="714" width="220" height="118" rx="10" class="del"/><use href="#robot" x="1009" y="698" width="26" height="26"/>
    <text x="928" y="742" text-anchor="middle" class="t">Verificación</text>
    <text x="928" y="765" text-anchor="middle" class="s">/up responde 200 y Claude</text>
    <text x="928" y="783" text-anchor="middle" class="s">repite el recorrido real en</text>
    <text x="928" y="801" text-anchor="middle" class="s">el enlace público</text>

    <rect x="1064" y="714" width="220" height="118" rx="10" class="per"/>
    <text x="1174" y="742" text-anchor="middle" class="t">Revisión e integración</text>
    <text x="1174" y="765" text-anchor="middle" class="s">El equipo revisa capturas</text>
    <text x="1174" y="783" text-anchor="middle" class="s">y resultados, y presenta</text>
    <text x="1174" y="801" text-anchor="middle" class="s">el cambio</text>
  </g>
  <line x1="300" y1="773" x2="324" y2="773" class="ln" marker-end="url(#f)"/>
  <line x1="546" y1="773" x2="570" y2="773" class="ln" marker-end="url(#f)"/>
  <line x1="792" y1="773" x2="816" y2="773" class="ln" marker-end="url(#f)"/>
  <line x1="1038" y1="773" x2="1062" y2="773" class="ln" marker-end="url(#f)"/>
  <path d="M190 832 V872 H44 V500 H78" class="rt" marker-end="url(#fr)"/>
  <text x="200" y="862" font-size="12.5" font-weight="700" fill="#b91c1c">Si falla una prueba o el Quality Gate: no se despliega, nuevo cambio</text>

  <!-- Ejemplo real -->
  <rect x="60" y="906" width="1240" height="190" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
  <text x="80" y="934" class="pt">Ejemplo real del proyecto: «creé una cuenta y mi local no se guarda»</text>
  <g font-size="13.5" fill="#1f2937">
    <text x="80" y="962"><tspan font-weight="800">1 · 4</tspan>  El equipo lo reporta con una captura; Claude revisa el registro de Apache (POST /autoevaluacion → 302 sin guardar) y el equipo aprueba la corrección.</text>
    <text x="80" y="988"><tspan font-weight="800">3</tspan>  Causa encontrada: una redirección de ruta, con las rutas en caché de producción, atrapaba el botón «Guardar».</text>
    <text x="80" y="1014"><tspan font-weight="800">5</tspan>  Claude corrige una línea en routes/web.php y prueba como cliente nuevo: registro → local guardado → condiciones.</text>
    <text x="80" y="1040"><tspan font-weight="800">6</tspan>  Push → CI en verde (PHP, Cypress, linter) → Render se actualiza en ~2 min → verificado en el enlace público.</text>
    <text x="80" y="1074" font-size="13" font-style="italic" fill="#475569">«IA con ejecución delegada»: Claude Code ejecuta el paso; la decisión y la aprobación siguen siendo responsabilidad del equipo.</text>
  </g>

  <!-- Panel: Claude Code -->
  <rect x="1350" y="132" width="440" height="980" rx="14" fill="#fff7ed" stroke="#d97757" stroke-width="2"/>
  <use href="#robot" x="1500" y="148" width="140" height="140"/>
  <text x="1570" y="314" text-anchor="middle" font-size="24" font-weight="800" fill="#7c2d12">Claude Code</text>
  <text x="1570" y="338" text-anchor="middle" font-size="14" fill="#9a3412">Asistente de IA dentro de VS Code</text>
  <line x1="1376" y1="356" x2="1764" y2="356" stroke="#fdba74"/>
  <text x="1374" y="384" class="pt">Lo que hizo en este proyecto</text>
  <g class="p">
    <text x="1374" y="412">🔎 Leyó el código, los registros de Apache</text>
    <text x="1398" y="430">y Laravel y la base de datos</text>
    <text x="1374" y="458">🧭 Explicó cada problema y propuso</text>
    <text x="1398" y="476">el plan antes de cambiar nada</text>
    <text x="1374" y="504">✏️ Programó en Laravel y React: registro</text>
    <text x="1398" y="522">en 2 pasos, guardado automático y</text>
    <text x="1398" y="540">reportes de impacto</text>
    <text x="1374" y="568">🧪 Escribió y ejecutó pruebas (Pest,</text>
    <text x="1398" y="586">Cypress) y probó como cliente nuevo</text>
    <text x="1374" y="614">🐞 Corrigió fallas reales: local que no se</text>
    <text x="1398" y="632">guardaba, botones que fallaban (token</text>
    <text x="1398" y="650">CSRF), respuestas que se borraban</text>
    <text x="1374" y="678">📊 Ejecutó SonarQube y la matriz de</text>
    <text x="1398" y="696">control y monitoreo</text>
    <text x="1374" y="724">📦 Hizo commit y push, y verificó</text>
    <text x="1398" y="742">GitHub Actions y Render</text>
    <text x="1374" y="770">📄 Generó diagramas, evidencias y la</text>
    <text x="1398" y="788">documentación del informe</text>
  </g>
  <line x1="1376" y1="808" x2="1764" y2="808" stroke="#fdba74"/>
  <text x="1374" y="836" font-size="15" font-weight="800" fill="#166534">Lo que decidió el equipo</text>
  <g class="p">
    <text x="1374" y="862">👥 Qué construir y en qué orden</text>
    <text x="1374" y="886">✋ Aprobar cada plan antes de programar</text>
    <text x="1374" y="910">👀 Revisar capturas y resultados</text>
  </g>
  <line x1="1376" y1="930" x2="1764" y2="930" stroke="#fdba74"/>
  <text x="1374" y="958" font-size="15" font-weight="800" fill="#1e3a8a">Reglas de trabajo</text>
  <g class="p">
    <text x="1374" y="984">🔒 Nunca sube claves ni archivos .env</text>
    <text x="1374" y="1008">⛔ Sin CI en verde no se publica</text>
    <text x="1374" y="1032">✋ Sin aprobación no se edita código</text>
    <text x="1374" y="1056">🧾 Cada cambio queda con su evidencia</text>
  </g>
</svg>
