<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480" font-family="Segoe UI, Segoe UI Emoji, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="fr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <style>
      .tt{font-size:17px;font-weight:800;fill:#0f172a}
      .dd{font-size:13.5px;fill:#334155}
      .nn{font-size:14px;font-weight:900;fill:#fff}
      .ln{stroke:#334155;stroke-width:2.2;fill:none}
      .rt{stroke:#b91c1c;stroke-width:2;fill:none;stroke-dasharray:7 5}
      .rl{font-size:12.5px;font-weight:700;fill:#b91c1c}
      .eq{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .ia{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .au{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1480" fill="#ffffff"/>
  <text x="40" y="46" font-size="27" font-weight="800" fill="#17133a">CheckITSE Huancayo · Cómo desarrollamos el proyecto con IA (Claude Code)</text>
  <text x="40" y="74" font-size="15" fill="#334155">El equipo decide y aprueba · la IA investiga, programa y prueba dentro del repositorio · la automatización verifica antes de publicar.</text>

  <!-- Carriles -->
  <rect x="30" y="100" width="360" height="1110" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="410" y="100" width="660" height="1110" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="1090" y="100" width="480" height="1110" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="210" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#166534">👥 Equipo (William y Yolvy)</text>
  <text x="740" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#92400e">🤖 Claude Code en VS Code (IA con ejecución delegada)</text>
  <text x="1330" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">⚙️ Automatización sin IA</text>

  <!-- Paso 1 -->
  <rect x="50" y="160" width="320" height="66" rx="10" class="eq"/><circle cx="72" cy="182" r="13" fill="#16a34a"/><text x="72" y="187" text-anchor="middle" class="nn">1</text>
  <text x="94" y="188" class="tt">💬 Pide un cambio</text><text x="94" y="210" class="dd">En español, como cliente: «no se guarda»</text>
  <!-- Paso 2 -->
  <rect x="430" y="240" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="262" r="13" fill="#d97706"/><text x="452" y="267" text-anchor="middle" class="nn">2</text>
  <text x="474" y="268" class="tt">🔎 Investiga</text><text x="474" y="290" class="dd">Lee el código, revisa registros de Apache y Laravel, consulta la base de datos</text>
  <!-- Paso 3 -->
  <rect x="430" y="320" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="342" r="13" fill="#d97706"/><text x="452" y="347" text-anchor="middle" class="nn">3</text>
  <text x="474" y="348" class="tt">🧭 Explica la causa y propone</text><text x="474" y="370" class="dd">Plan del cambio; si falta una decisión del equipo, pregunta antes de seguir</text>
  <!-- Paso 4 -->
  <rect x="50" y="400" width="320" height="66" rx="10" class="eq"/><circle cx="72" cy="422" r="13" fill="#16a34a"/><text x="72" y="427" text-anchor="middle" class="nn">4</text>
  <text x="94" y="428" class="tt">✋ Aprueba o corrige</text><text x="94" y="450" class="dd">Sin aprobación no se edita el código</text>
  <!-- Paso 5 -->
  <rect x="430" y="480" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="502" r="13" fill="#d97706"/><text x="452" y="507" text-anchor="middle" class="nn">5</text>
  <text x="474" y="508" class="tt">✏️ Programa el cambio</text><text x="474" y="530" class="dd">Laravel (PHP), React (TypeScript) y sus pruebas, en la rama feature/…</text>
  <!-- Paso 6 -->
  <rect x="430" y="560" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="582" r="13" fill="#d97706"/><text x="452" y="587" text-anchor="middle" class="nn">6</text>
  <text x="474" y="588" class="tt">🧪 Prueba como un cliente nuevo</text><text x="474" y="610" class="dd">Pest, tsc y ESLint + navegador automatizado: registra, guarda y toma capturas</text>
  <!-- Paso 7 -->
  <rect x="50" y="640" width="320" height="66" rx="10" class="eq"/><circle cx="72" cy="662" r="13" fill="#16a34a"/><text x="72" y="667" text-anchor="middle" class="nn">7</text>
  <text x="94" y="668" class="tt">👀 Revisa el resultado</text><text x="94" y="690" class="dd">Capturas, cifras y la app en su PC</text>
  <!-- Paso 8 -->
  <rect x="430" y="720" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="742" r="13" fill="#d97706"/><text x="452" y="747" text-anchor="middle" class="nn">8</text>
  <text x="474" y="748" class="tt">📦 Commit y push a GitHub</text><text x="474" y="770" class="dd">Mensaje claro del cambio · rama → main y develop · nunca sube claves ni .env</text>
  <!-- Paso 9 -->
  <rect x="1110" y="800" width="440" height="66" rx="10" class="au"/><circle cx="1132" cy="822" r="13" fill="#64748b"/><text x="1132" y="827" text-anchor="middle" class="nn">9</text>
  <text x="1154" y="828" class="tt">✅ GitHub Actions (CI)</text><text x="1154" y="850" class="dd">Linter · 775 pruebas PHP · Cypress E2E</text>
  <!-- Paso 10 -->
  <rect x="1110" y="880" width="440" height="66" rx="10" class="au"/><circle cx="1132" cy="902" r="13" fill="#64748b"/><text x="1132" y="907" text-anchor="middle" class="nn">10</text>
  <text x="1154" y="908" class="tt">📊 SonarQube</text><text x="1154" y="930" class="dd">Quality Gate: 0 bugs · 0 vulnerabilidades</text>
  <!-- Paso 11 -->
  <rect x="1110" y="960" width="440" height="66" rx="10" class="au"/><circle cx="1132" cy="982" r="13" fill="#64748b"/><text x="1132" y="987" text-anchor="middle" class="nn">11</text>
  <text x="1154" y="988" class="tt">🚀 Despliegue</text><text x="1154" y="1010" class="dd">Render en ~2 min · XAMPP con puerta de CI</text>
  <!-- Paso 12 -->
  <rect x="430" y="1040" width="620" height="66" rx="10" class="ia"/><circle cx="452" cy="1062" r="13" fill="#d97706"/><text x="452" y="1067" text-anchor="middle" class="nn">12</text>
  <text x="474" y="1068" class="tt">🌐 Verifica en el enlace público</text><text x="474" y="1090" class="dd">/up responde 200 y repite el recorrido real en checkitse-huancayo.onrender.com</text>
  <!-- Paso 13 -->
  <rect x="50" y="1120" width="320" height="66" rx="10" class="eq"/><circle cx="72" cy="1142" r="13" fill="#16a34a"/><text x="72" y="1147" text-anchor="middle" class="nn">13</text>
  <text x="94" y="1148" class="tt">🎤 Usa y presenta</text><text x="94" y="1170" class="dd">El cambio ya está en la app</text>

  <!-- Flujo principal -->
  <path d="M370 193 H600 V238" class="ln" marker-end="url(#f)"/>
  <line x1="740" y1="306" x2="740" y2="318" class="ln" marker-end="url(#f)"/>
  <path d="M600 386 V433 H372" class="ln" marker-end="url(#f)"/>
  <path d="M370 445 H600 V478" class="ln" marker-end="url(#f)"/>
  <line x1="740" y1="546" x2="740" y2="558" class="ln" marker-end="url(#f)"/>
  <path d="M600 626 V673 H372" class="ln" marker-end="url(#f)"/>
  <path d="M370 685 H600 V718" class="ln" marker-end="url(#f)"/>
  <path d="M1050 753 H1330 V798" class="ln" marker-end="url(#f)"/>
  <line x1="1330" y1="866" x2="1330" y2="878" class="ln" marker-end="url(#f)"/>
  <line x1="1330" y1="946" x2="1330" y2="958" class="ln" marker-end="url(#f)"/>
  <path d="M1330 1026 V1073 H1052" class="ln" marker-end="url(#f)"/>
  <path d="M600 1106 V1153 H372" class="ln" marker-end="url(#f)"/>

  <!-- Bucles de corrección -->
  <path d="M60 400 V353 H428" class="rt" marker-end="url(#fr)"/><text x="80" y="345" class="rl">↺ pide otra solución</text>
  <path d="M60 640 V513 H428" class="rt" marker-end="url(#fr)"/><text x="80" y="505" class="rl">↺ pide ajustes</text>
  <path d="M1550 833 H1575 V470 H1060 V478" class="rt" marker-end="url(#fr)"/><text x="1190" y="462" class="rl">↺ si una prueba o el Quality Gate fallan: no se publica, se corrige</text>

  <!-- Ejemplo real -->
  <rect x="30" y="1230" width="1010" height="230" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="50" y="1262" font-size="17" font-weight="800" fill="#9a3412">Ejemplo real de esta semana: «creé una cuenta y mi local no se guarda»</text>
  <g font-size="14" fill="#1f2937">
    <text x="50" y="1294">1. 💬 El usuario lo reporta en el chat con una captura.</text>
    <text x="50" y="1320">2. 🔎 La IA revisa el registro de Apache: POST /autoevaluacion → 302, sin guardar nada.</text>
    <text x="50" y="1346">3. 🧭 Causa: una redirección de ruta, con las rutas en caché de producción, atrapaba el botón «Guardar».</text>
    <text x="50" y="1372">4. ✏️ Corrección de una línea en routes/web.php · 🧪 prueba como cliente nuevo: el local se guarda.</text>
    <text x="50" y="1398">5. 📦 Commit y push → ✅ CI en verde → 🚀 Render actualizado → 🌐 verificado en el enlace público.</text>
    <text x="50" y="1430" font-weight="700" fill="#9a3412">Total: un solo ciclo, sin tocar nada fuera de lo pedido, con evidencia en cada paso.</text>
  </g>

  <!-- Herramientas -->
  <rect x="1060" y="1230" width="510" height="230" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1080" y="1262" font-size="17" font-weight="800" fill="#1e40af">Herramientas que usa la IA</text>
  <g font-size="14" fill="#1f2937">
    <text x="1080" y="1294">📂 Leer y buscar en todo el código</text>
    <text x="1080" y="1320">✏️ Editar archivos (solo lo necesario)</text>
    <text x="1080" y="1346">💻 Terminal: PHP, npm, Git, base de datos</text>
    <text x="1080" y="1372">🌐 Navegador automatizado con capturas</text>
    <text x="1080" y="1398">🐳 Docker para SonarQube</text>
    <text x="1080" y="1424">🧠 Memoria de decisiones entre sesiones</text>
  </g>
</svg>
