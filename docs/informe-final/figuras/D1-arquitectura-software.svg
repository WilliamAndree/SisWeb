<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <style>
      .caja{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:15px;fill:#334155}
      .m{font-size:14px;fill:#475569}
      .capa{font-size:15px;font-weight:800;letter-spacing:2px;fill:#fff}
      .linea{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#f)}
      .punteada{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#f)}
      .et{font-size:13.5px;fill:#334155;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#fbf6ee"/>
  <text x="40" y="52" font-size="30" font-weight="800" fill="#17133a">CheckITSE Huancayo · Arquitectura de software</text>
  <text x="40" y="82" class="s">Monolito modular en capas (Laravel 12 + Inertia 2 + React 19). Un solo despliegue; el frontend se compila con Vite y lo sirve Laravel.</text>

  <!-- Usuarios -->
  <g>
    <rect x="40" y="110" width="1520" height="96" rx="16" fill="#17133a"/>
    <text x="64" y="140" class="capa">USUARIOS (NAVEGADOR WEB, CELULAR O PC)</text>
    <g font-size="17" fill="#fff" font-weight="600">
      <text x="64" y="178">👤 Emprendedor: evalúa su local, corrige y arma su expediente</text>
      <text x="690" y="178">🏪 Proveedor: publica productos y ve sus ventas</text>
      <text x="1170" y="178">🛡 Administración: pagos y reportes</text>
    </g>
  </g>
  <path class="linea" d="M800 206 V246"/>
  <text x="812" y="232" class="et">HTTPS · Inertia (HTML inicial + JSON por página)</text>

  <!-- Presentación -->
  <rect x="40" y="250" width="1520" height="170" rx="16" fill="#fff4ec" stroke="#ffc7a5" stroke-width="2"/>
  <text x="64" y="280" font-size="15" font-weight="800" letter-spacing="2" fill="#a1360c">CAPA DE PRESENTACIÓN · React 19 + TypeScript + Tailwind CSS 4 (resources/js)</text>
  <g>
    <rect x="64" y="298" width="280" height="104" class="caja"/><text x="80" y="328" class="t">Portada y directorio</text><text x="80" y="354" class="m">Evaluacion/Home · Directorio/Index</text><text x="80" y="376" class="m">Riesgos, aliados, animaciones</text>
    <rect x="360" y="298" width="280" height="104" class="caja"/><text x="376" y="328" class="t">Autoevaluación</text><text x="376" y="354" class="m">Nueva · Checklist · Resumen</text><text x="376" y="376" class="m">Corrección · Informe · Anexos</text>
    <rect x="656" y="298" width="280" height="104" class="caja"/><text x="672" y="328" class="t">Expediente digital</text><text x="672" y="354" class="m">Subida de documentos y fotos</text><text x="672" y="376" class="m">Ejemplo de croquis</text>
    <rect x="952" y="298" width="280" height="104" class="caja"/><text x="968" y="328" class="t">Cuenta de proveedor</text><text x="968" y="354" class="m">Productos · Ventas · Plan</text><text x="968" y="376" class="m">Estadísticas de visitas</text>
    <rect x="1248" y="298" width="288" height="104" class="caja" style="stroke:#c2410c;stroke-width:3"/><text x="1264" y="328" class="t">Administración</text><text x="1264" y="354" class="m">Pagos · Negocios · Vencimientos</text><text x="1264" y="376" class="m" font-weight="700" fill="#a1360c">Reportes de impacto (nuevo)</text>
  </g>
  <path class="linea" d="M800 420 V460"/>
  <text x="812" y="446" class="et">Rutas web (routes/web.php) · middleware: auth, admin, CSRF, throttle</text>

  <!-- Aplicación -->
  <rect x="40" y="464" width="1520" height="250" rx="16" fill="#f3f1fd" stroke="#cdc6f4" stroke-width="2"/>
  <text x="64" y="494" font-size="15" font-weight="800" letter-spacing="2" fill="#3a307a">CAPA DE APLICACIÓN · Laravel 12 / PHP 8.2 (app/)</text>
  <g>
    <rect x="64" y="510" width="700" height="88" class="caja"/>
    <text x="80" y="540" class="t">Controladores (HTTP)</text>
    <text x="80" y="566" class="m">EvaluacionController · ExpedienteDigitalController · DirectorioController</text>
    <text x="80" y="586" class="m">ProveedorPanelController · AdminController · ReportesController (nuevo)</text>
    <rect x="780" y="510" width="756" height="88" class="caja"/>
    <text x="796" y="540" class="t">Servicios (lógica de negocio)</text>
    <text x="796" y="566" class="m">ApplicabilityEngine (qué condiciones aplican) · ItseRiskService (riesgo y semáforo)</text>
    <text x="796" y="586" class="m">SubsanacionSyncService · PlanesProveedor · ReportesImpactoService (nuevo) · Matriz de monitoreo</text>
    <rect x="64" y="612" width="700" height="86" class="caja"/>
    <text x="80" y="642" class="t">Modelos Eloquent (dominio)</text>
    <text x="80" y="668" class="m">Autoevaluacion · RespuestaAutoevaluacion · CriterioNormativo · Subsanacion</text>
    <text x="80" y="688" class="m">ProveedorRecurso · OfertaProveedor · EventoProveedor · SolicitudPlan · User</text>
    <rect x="780" y="612" width="756" height="86" class="caja"/>
    <text x="796" y="642" class="t">Comandos y tareas programadas</text>
    <text x="796" y="668" class="m">checkitse:vencer-planes (diario 00:10) · checkitse:sincronizar-subsanaciones</text>
    <text x="796" y="688" class="m">checkitse:matriz-monitoreo · checkitse:e2e-preparar (solo base *_e2e)</text>
  </g>
  <path class="linea" d="M420 714 V776"/>
  <text x="432" y="748" class="et">Eloquent / PDO MySQL</text>
  <path class="linea" d="M1170 714 V776"/>
  <text x="1182" y="748" class="et">Disco local privado</text>

  <!-- Datos -->
  <rect x="40" y="780" width="900" height="150" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="810" font-size="15" font-weight="800" letter-spacing="2" fill="#17133a">CAPA DE DATOS · MariaDB 10.4 (base sisweb)</text>
  <text x="64" y="840" class="s">autoevaluaciones (con foto sellada SHA-256) · respuestas_autoevaluacion · criterios_normativos</text>
  <text x="64" y="864" class="s">subsanaciones + historial_subsanaciones · documentos de expediente · users · sessions</text>
  <text x="64" y="888" class="s">proveedores_recursos · ofertas · eventos_proveedor · ventas_proveedor · solicitudes_plan</text>
  <text x="64" y="914" class="m">Pruebas: sisweb_testing (Pest) y sisweb_e2e (Cypress), siempre separadas de la base real.</text>
  <rect x="960" y="780" width="600" height="150" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="984" y="810" font-size="15" font-weight="800" letter-spacing="2" fill="#17133a">ALMACENAMIENTO DE ARCHIVOS</text>
  <text x="984" y="840" class="s">storage/app (no público): fotos de correcciones,</text>
  <text x="984" y="864" class="s">documentos del expediente, comprobantes de pago.</text>
  <text x="984" y="888" class="s">Se sirven solo al dueño por ruta autorizada.</text>

  <!-- Externos -->
  <rect x="40" y="950" width="1520" height="92" rx="16" fill="#fff8e6" stroke="#ffd56b" stroke-width="2"/>
  <text x="64" y="978" font-size="15" font-weight="800" letter-spacing="2" fill="#9a5b00">SERVICIOS EXTERNOS</text>
  <text x="64" y="1006" class="s">Google Gemini API (opcional: orientación sobre fotos de correcciones) · WhatsApp (enlaces wa.me) · Google Maps / OpenStreetMap (mapas embebidos)</text>
  <text x="64" y="1030" class="s">YouTube sin cookies (videos educativos) · Bunny Fonts (tipografías) · SonarQube (análisis, fuera de la aplicación)</text>
</svg>
