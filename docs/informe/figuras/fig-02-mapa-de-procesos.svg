<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, Helvetica, sans-serif">
  <title>Figura 2. Mapa de macroprocesos de CheckITSE Huancayo</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#17133a"/>
    </marker>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#17133a">Mapa de macroprocesos de CheckITSE Huancayo</text>

  <!-- Entrada y salida -->
  <rect x="20" y="300" width="150" height="190" rx="12" fill="#fff1e8" stroke="#c2410c" stroke-width="2"/>
  <text x="95" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">ENTRADA</text>
  <text x="95" y="375" text-anchor="middle" font-size="14" fill="#334155">Emprendedor</text>
  <text x="95" y="395" text-anchor="middle" font-size="14" fill="#334155">con un local</text>
  <text x="95" y="415" text-anchor="middle" font-size="14" fill="#334155">que necesita</text>
  <text x="95" y="435" text-anchor="middle" font-size="14" fill="#334155">su ITSE</text>
  <rect x="1030" y="300" width="150" height="190" rx="12" fill="#f3f1fd" stroke="#463a96" stroke-width="2"/>
  <text x="1105" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f2863">SALIDA</text>
  <text x="1105" y="375" text-anchor="middle" font-size="14" fill="#334155">Local listo</text>
  <text x="1105" y="395" text-anchor="middle" font-size="14" fill="#334155">para la</text>
  <text x="1105" y="415" text-anchor="middle" font-size="14" fill="#334155">inspección, con</text>
  <text x="1105" y="435" text-anchor="middle" font-size="14" fill="#334155">su expediente</text>

  <!-- Estratégicos -->
  <rect x="190" y="70" width="820" height="170" rx="14" fill="#fff8e6" stroke="#9a5b00" stroke-width="2"/>
  <text x="600" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c4a00">PROCESOS ESTRATÉGICOS</text>
  <g font-size="14">
    <rect x="215" y="115" width="380" height="105" rx="10" fill="#ffffff" stroke="#c99a3a"/>
    <text x="405" y="145" text-anchor="middle" font-weight="bold" fill="#0f172a">E1. Modelo de negocio y planes</text>
    <text x="405" y="170" text-anchor="middle" fill="#334155">Definir planes (Básico, Destacado,</text>
    <text x="405" y="190" text-anchor="middle" fill="#334155">Premium), precios y beneficios</text>
    <rect x="605" y="115" width="380" height="105" rx="10" fill="#ffffff" stroke="#c99a3a"/>
    <text x="795" y="145" text-anchor="middle" font-weight="bold" fill="#0f172a">E2. Calidad y mejora continua</text>
    <text x="795" y="170" text-anchor="middle" fill="#334155">Pruebas automatizadas, SonarQube</text>
    <text x="795" y="190" text-anchor="middle" fill="#334155">y matriz de monitoreo</text>
  </g>

  <!-- Misionales -->
  <rect x="190" y="260" width="820" height="290" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">PROCESOS MISIONALES (cadena de valor del emprendedor)</text>
  <g font-size="14">
    <rect x="215" y="305" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="337" y="335" text-anchor="middle" font-weight="bold" fill="#0f172a">M1. Registro del local</text>
    <text x="337" y="360" text-anchor="middle" fill="#334155">Datos, giro, aforo,</text>
    <text x="337" y="380" text-anchor="middle" fill="#334155">características</text>
    <rect x="477" y="305" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="599" y="335" text-anchor="middle" font-weight="bold" fill="#0f172a">M2. Autoevaluación ITSE</text>
    <text x="599" y="360" text-anchor="middle" fill="#334155">Condiciones aplicables</text>
    <text x="599" y="380" text-anchor="middle" fill="#334155">y nivel de riesgo</text>
    <rect x="739" y="305" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="861" y="335" text-anchor="middle" font-weight="bold" fill="#0f172a">M3. Resultado y plan</text>
    <text x="861" y="360" text-anchor="middle" fill="#334155">% listo, lo que falta</text>
    <text x="861" y="380" text-anchor="middle" fill="#334155">y qué hacer</text>
    <rect x="215" y="425" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="337" y="455" text-anchor="middle" font-weight="bold" fill="#0f172a">M4. Subsanación</text>
    <text x="337" y="480" text-anchor="middle" fill="#334155">Proveedores de la zona,</text>
    <text x="337" y="500" text-anchor="middle" fill="#334155">WhatsApp y evidencias</text>
    <rect x="477" y="425" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="599" y="455" text-anchor="middle" font-weight="bold" fill="#0f172a">M5. Expediente digital</text>
    <text x="599" y="480" text-anchor="middle" fill="#334155">Documentos del trámite</text>
    <text x="599" y="500" text-anchor="middle" fill="#334155">e informe preventivo</text>
    <rect x="739" y="425" width="245" height="100" rx="10" fill="#ffffff" stroke="#ea7a45"/>
    <text x="861" y="455" text-anchor="middle" font-weight="bold" fill="#0f172a">M6. Seguimiento</text>
    <text x="861" y="480" text-anchor="middle" fill="#334155">Panel, reevaluación</text>
    <text x="861" y="500" text-anchor="middle" fill="#334155">e historial</text>
  </g>
  <g stroke="#17133a" stroke-width="2" marker-end="url(#f)">
    <line x1="460" y1="355" x2="475" y2="355"/>
    <line x1="722" y1="355" x2="737" y2="355"/>
    <line x1="460" y1="475" x2="475" y2="475"/>
    <line x1="722" y1="475" x2="737" y2="475"/>
    <line x1="170" y1="395" x2="188" y2="395"/>
    <line x1="1010" y1="395" x2="1028" y2="395"/>
  </g>
  <path d="M861 405 L861 415 L337 415 L337 423" fill="none" stroke="#17133a" stroke-width="2" marker-end="url(#f)"/>

  <!-- Soporte -->
  <rect x="190" y="570" width="820" height="225" rx="14" fill="#f3f1fd" stroke="#463a96" stroke-width="2"/>
  <text x="600" y="598" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2863">PROCESOS DE SOPORTE</text>
  <g font-size="14">
    <rect x="215" y="615" width="245" height="78" rx="10" fill="#ffffff" stroke="#8576dc"/>
    <text x="337" y="645" text-anchor="middle" font-weight="bold" fill="#0f172a">S1. Cuentas y accesos</text>
    <text x="337" y="670" text-anchor="middle" fill="#334155">Cliente · Proveedor · Admin</text>
    <rect x="477" y="615" width="245" height="78" rx="10" fill="#ffffff" stroke="#8576dc"/>
    <text x="599" y="645" text-anchor="middle" font-weight="bold" fill="#0f172a">S2. Gestión de proveedores</text>
    <text x="599" y="670" text-anchor="middle" fill="#334155">Catálogo, ventas, estadísticas</text>
    <rect x="739" y="615" width="245" height="78" rx="10" fill="#ffffff" stroke="#8576dc"/>
    <text x="861" y="645" text-anchor="middle" font-weight="bold" fill="#0f172a">S3. Cobros de planes</text>
    <text x="861" y="670" text-anchor="middle" fill="#334155">Comprobante Yape/Plin</text>
    <rect x="345" y="705" width="245" height="78" rx="10" fill="#ffffff" stroke="#8576dc"/>
    <text x="467" y="735" text-anchor="middle" font-weight="bold" fill="#0f172a">S4. Administración</text>
    <text x="467" y="760" text-anchor="middle" fill="#334155">Aprobaciones, ingresos, vencimientos</text>
    <rect x="610" y="705" width="245" height="78" rx="10" fill="#ffffff" stroke="#8576dc"/>
    <text x="732" y="735" text-anchor="middle" font-weight="bold" fill="#0f172a">S5. Plataforma y datos</text>
    <text x="732" y="760" text-anchor="middle" fill="#334155">Seguridad, integridad, despliegue</text>
  </g>
</svg>
