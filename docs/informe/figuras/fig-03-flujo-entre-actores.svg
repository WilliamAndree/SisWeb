<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <title>Figura 3. Flujo entre actores de CheckITSE Huancayo</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#17133a"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#17133a">Flujo entre actores (diagrama de carriles)</text>

  <!-- Carriles -->
  <g font-size="15" font-weight="bold">
    <rect x="20" y="60" width="1160" height="175" fill="#fff1e8" stroke="#c2410c"/>
    <rect x="20" y="60" width="150" height="175" fill="#c2410c"/>
    <text x="95" y="152" text-anchor="middle" fill="#ffffff">Emprendedor</text>
    <rect x="20" y="235" width="1160" height="175" fill="#fff8e6" stroke="#9a5b00"/>
    <rect x="20" y="235" width="150" height="175" fill="#9a5b00"/>
    <text x="95" y="327" text-anchor="middle" fill="#ffffff">Proveedor</text>
    <rect x="20" y="410" width="1160" height="175" fill="#f3f1fd" stroke="#463a96"/>
    <rect x="20" y="410" width="150" height="175" fill="#463a96"/>
    <text x="95" y="502" text-anchor="middle" fill="#ffffff">Administrador</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <!-- Emprendedor -->
    <rect x="190" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="265" y="140" text-anchor="middle" font-weight="bold">1. Registra</text>
    <text x="265" y="160" text-anchor="middle">su local</text>
    <rect x="360" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="435" y="140" text-anchor="middle" font-weight="bold">2. Simula su</text>
    <text x="435" y="160" text-anchor="middle">inspección</text>
    <rect x="530" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="605" y="140" text-anchor="middle" font-weight="bold">3. Ve % listo</text>
    <text x="605" y="160" text-anchor="middle">y lo que falta</text>
    <rect x="700" y="110" width="150" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="775" y="140" text-anchor="middle" font-weight="bold">4. Compara y</text>
    <text x="775" y="160" text-anchor="middle">escribe por WhatsApp</text>
    <rect x="870" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="940" y="140" text-anchor="middle" font-weight="bold">5. Subsana</text>
    <text x="940" y="160" text-anchor="middle">y sube evidencia</text>
    <rect x="1030" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
    <text x="1100" y="140" text-anchor="middle" font-weight="bold">6. Arma su</text>
    <text x="1100" y="160" text-anchor="middle">expediente</text>

    <!-- Proveedor -->
    <rect x="190" y="285" width="160" height="70" rx="10" fill="#ffffff" stroke="#9a5b00"/>
    <text x="270" y="315" text-anchor="middle" font-weight="bold">A. Crea su cuenta</text>
    <text x="270" y="335" text-anchor="middle">y su negocio</text>
    <rect x="380" y="285" width="160" height="70" rx="10" fill="#ffffff" stroke="#9a5b00"/>
    <text x="460" y="315" text-anchor="middle" font-weight="bold">B. Publica productos</text>
    <text x="460" y="335" text-anchor="middle">con precio y zona</text>
    <rect x="700" y="285" width="150" height="70" rx="10" fill="#ffffff" stroke="#9a5b00"/>
    <text x="775" y="315" text-anchor="middle" font-weight="bold">C. Atiende al</text>
    <text x="775" y="335" text-anchor="middle">cliente y vende</text>
    <rect x="870" y="285" width="160" height="70" rx="10" fill="#ffffff" stroke="#9a5b00"/>
    <text x="950" y="315" text-anchor="middle" font-weight="bold">D. Registra ventas,</text>
    <text x="950" y="335" text-anchor="middle">ve estadísticas</text>
    <rect x="570" y="285" width="110" height="70" rx="10" fill="#ffffff" stroke="#9a5b00"/>
    <text x="625" y="315" text-anchor="middle" font-weight="bold">E. Paga plan</text>
    <text x="625" y="335" text-anchor="middle">(Yape/Plin)</text>

    <!-- Administrador -->
    <rect x="190" y="460" width="190" height="70" rx="10" fill="#ffffff" stroke="#463a96"/>
    <text x="285" y="490" text-anchor="middle" font-weight="bold">I. Aprueba o pide</text>
    <text x="285" y="510" text-anchor="middle">corregir el negocio</text>
    <rect x="530" y="460" width="190" height="70" rx="10" fill="#ffffff" stroke="#463a96"/>
    <text x="625" y="490" text-anchor="middle" font-weight="bold">II. Revisa comprobante</text>
    <text x="625" y="510" text-anchor="middle">y activa el plan</text>
    <rect x="870" y="460" width="290" height="70" rx="10" fill="#ffffff" stroke="#463a96"/>
    <text x="1015" y="490" text-anchor="middle" font-weight="bold">III. Monitorea ingresos y recuerda</text>
    <text x="1015" y="510" text-anchor="middle">vencimientos por WhatsApp</text>
  </g>

  <g stroke="#17133a" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="340" y1="145" x2="358" y2="145"/>
    <line x1="510" y1="145" x2="528" y2="145"/>
    <line x1="680" y1="145" x2="698" y2="145"/>
    <line x1="850" y1="145" x2="868" y2="145"/>
    <line x1="1010" y1="145" x2="1028" y2="145"/>
    <line x1="350" y1="320" x2="378" y2="320"/>
    <line x1="270" y1="355" x2="280" y2="458"/>
    <line x1="625" y1="355" x2="625" y2="458"/>
    <line x1="850" y1="320" x2="868" y2="320"/>
    <path d="M380 495 L460 495 L460 360"/>
    <path d="M775 180 L775 283" stroke-dasharray="6 4"/>
    <path d="M720 495 L868 495"/>
  </g>
  <text x="785" y="235" font-size="12" fill="#475569">contacto privado</text>
  <text x="472" y="400" font-size="12" fill="#475569">publicado: aparece al cliente</text>

  <text x="600" y="618" text-anchor="middle" font-size="13" fill="#475569">Solo los negocios aprobados aparecen al emprendedor. El contacto cliente–proveedor es directo y privado por WhatsApp.</text>
</svg>
