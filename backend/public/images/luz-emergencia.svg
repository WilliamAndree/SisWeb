<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" role="img" aria-label="Luz de emergencia blanca de dos focos instalada en la pared">
  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2550"/>
      <stop offset="1" stop-color="#17133a"/>
    </linearGradient>
    <radialGradient id="haz" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffe9a8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ec"/>
    </linearGradient>
    <linearGradient id="foco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d8e0"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.6" stop-color="#ffe38a"/>
      <stop offset="1" stop-color="#f5b700"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="667" fill="url(#pared)"/>
  <!-- Haces de luz hacia abajo -->
  <path d="M315 250 L80 667 L520 667 Z" fill="url(#haz)"/>
  <path d="M685 250 L480 667 L920 667 Z" fill="url(#haz)"/>

  <!-- Cuerpo de la luz -->
  <g filter="url(#sombra)">
    <rect x="300" y="150" width="400" height="150" rx="22" fill="url(#caja)"/>
    <rect x="300" y="150" width="400" height="22" rx="11" fill="#ffffff" opacity="0.7"/>
    <!-- Rejilla -->
    <g fill="#c9ced8">
      <rect x="430" y="200" width="140" height="8" rx="4"/>
      <rect x="430" y="220" width="140" height="8" rx="4"/>
      <rect x="430" y="240" width="140" height="8" rx="4"/>
    </g>
    <!-- LED de carga y botón de prueba -->
    <circle cx="440" cy="272" r="7" fill="#22c55e"/>
    <circle cx="440" cy="272" r="12" fill="#22c55e" opacity="0.25"/>
    <rect x="470" y="264" width="58" height="16" rx="8" fill="#ced3dc"/>
    <text x="499" y="276" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6273" text-anchor="middle">TEST</text>
  </g>

  <!-- Brazos y focos orientables -->
  <g filter="url(#sombra)">
    <rect x="322" y="196" width="28" height="44" rx="8" fill="#d9dde5"/>
    <rect x="650" y="196" width="28" height="44" rx="8" fill="#d9dde5"/>
    <circle cx="315" cy="250" r="58" fill="url(#foco)"/>
    <circle cx="685" cy="250" r="58" fill="url(#foco)"/>
    <circle cx="315" cy="250" r="40" fill="url(#led)"/>
    <circle cx="685" cy="250" r="40" fill="url(#led)"/>
    <circle cx="303" cy="238" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="673" cy="238" r="10" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Cable a la pared -->
  <path d="M500 150 C500 110 520 80 560 60 L620 30" stroke="#e3e6ec" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
