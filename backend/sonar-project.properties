sonar.projectKey=ITSE
sonar.projectName=ITSE
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9000

# Punto 15: Carpetas clave a auditar (PHP + React/TSX)
sonar.sources=app,routes,resources/js,database,config

# Exclusiones indispensables para no saturar el análisis
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,bootstrap/cache/**,resources/css/**

# Pruebas automatizadas
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php

# Puntos 16 y 18: Vinculación del reporte Clover generado
sonar.php.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8