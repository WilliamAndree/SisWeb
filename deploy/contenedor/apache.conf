# Sitio de CheckITSE dentro del contenedor: igual que deploy/xampp/checkitse.conf, en el puerto 80.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    # Mismo límite de subida que en XAMPP (10 MB).
    LimitRequestBody 10485760
    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
